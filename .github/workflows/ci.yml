name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: product_price_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create database tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d product_price_intelligence_test -c "CREATE TABLE products (id SERIAL PRIMARY KEY, name TEXT NOT NULL, external_id TEXT UNIQUE NOT NULL);"
          psql -h localhost -U postgres -d product_price_intelligence_test -c "CREATE TABLE price_history (id SERIAL PRIMARY KEY, product_id INT NOT NULL REFERENCES products(id), price NUMERIC(10, 2) NOT NULL, recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: product_price_intelligence_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: python -m pytest -v